<h1 class="text-2xl sm:text-3xl  mb-2 text-[#D48905] ms-5">Dashboard</h1>

<div
  class="bg-white border border-[#EAB515]/60 rounded-3xl shadow-md hover:shadow-lg transition-all duration-300"
>
  <!-- 🟨 Header Section -->
  <div
    class="bg-gradient-to-r from-[#FEEA6E] via-[#FBD63D] to-[#EAB515] rounded-t-3xl 
           p-4 sm:p-8 flex flex-row items-center justify-between text-left sm:text-left gap-4 flex-wrap mb-6"
  >
    <!-- 🧩 Profile Image -->
    <img
      id="profileImage"
      src="https://via.placeholder.com/120"
      alt="Profile"
      class="w-20 h-20 sm:w-24 sm:h-24 rounded-full border-4 border-[#D48905] shadow-md object-cover hover:scale-105 transition-transform duration-300"
    />

    <!-- 👤 Username + Level + Progress -->
    <div class="flex-1 min-w-[160px]">
      <h2
        class="text-xl sm:text-2xl  text-[#4b3a00] flex items-center justify-start gap-2 mt-6"
      >
        <span id="username-display">Username</span>
      </h2>

      <p
        id="userLevel"
        class="text-xs sm:text-sm text-[#4b3a00]/70 mt-1 "
      >
        Level 1 – Beginner 🐣
      </p>

      <div class="mt-3 w-full sm:w-1/2 bg-[#ffffff90] rounded-full h-2 overflow-hidden">
        <div
          id="progressBar"
          class="bg-[#D48905] h-2 rounded-full transition-all duration-700"
          style="width: 1%"
        ></div>
      </div>

      <p class="text-[10px] sm:text-xs text-[#4b3a00]/60 mt-1 mb-6">
        Progress to next rank
      </p>
    </div>

    <!-- 🏅 Rank (Right Aligned — Always on Right Even in Mobile) -->
    <div
      id="userRankDisplay"
      class="flex flex-col items-center sm:items-end text-[#4b3a00] text-right"
    >
      <p class="text-xs sm:text-sm text-[#4b3a00]/70 font-semibold leading-tight">
        Rank
      </p>
      <span
        id="userRank"
        class="text-xl sm:text-3xl font-extrabold text-[#D48905] leading-none glow-text "
      >
        #0
      </span>
    </div>
  </div>

  <!-- 🟨 Stats Cards -->
  <div
    class="grid grid-cols-1 sm:grid-cols-2 gap-5 sm:gap-6 p-4  bg-[#fffdf5] rounded-b-3xl text-center"
  >
    <div
      class="bg-white border border-[#EAB515]/50 rounded-2xl p-4 shadow-sm hover:-translate-y-1 hover:shadow-md transition-all duration-300"
    >
      <p class="text-xs sm:text-sm text-[#4b3a00]/70">💎 Total Points</p>
      <h3
        class="text-2xl sm:text-3xl font-extrabold text-[#D48905] mt-1"
      >
        <span id="userPoints">0</span>
      </h3>
    </div>

    <div
      class="bg-white border border-[#EAB515]/50 rounded-2xl p-4 shadow-sm hover:-translate-y-1 hover:shadow-md transition-all duration-300"
    >
      <p class="text-xs sm:text-sm text-[#4b3a00]/70">⭐ High Score</p>
      <h3
        class="text-2xl sm:text-3xl font-extrabold text-[#EAB515] mt-1"
      >
        <span id="userReputation">0</span>
      </h3>
    </div>

    <div
      class="bg-white border border-[#EAB515]/50 rounded-2xl p-4 shadow-sm hover:-translate-y-1 hover:shadow-md transition-all duration-300"
    >
      <p class="text-xs sm:text-sm text-[#4b3a00]/70">💰 Steem Coin</p>
      <h3 class="text-2xl sm:text-3xl font-extrabold text-[#D48905] mt-1">
        <span>0</span>
      </h3>
    </div>

    <div
      class="bg-white border border-[#EAB515]/50 rounded-2xl p-4 shadow-sm hover:-translate-y-1 hover:shadow-md transition-all duration-300"
    >
      <p class="text-xs sm:text-sm text-[#4b3a00]/70">📋 Reports</p>
      <h3 class="text-2xl sm:text-3xl font-extrabold text-[#EAB515] mt-1">
        <span>0</span>
      </h3>
    </div>
  </div>
</div>

<script type="module" src="../js/dashboard.js"></script>
